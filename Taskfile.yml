version: '3'

dotenv:
  - deployments/.env

env:
  CGO_ENABLED: "1"

vars:
  MODULE_PATH: 'github.com/7cout/minissp'
  DATABASE_URL: 'postgres://{{.POSTGRES_USER}}:{{.POSTGRES_PASSWORD}}@{{.POSTGRES_HOST}}:{{.POSTGRES_PORT}}/{{.POSTGRES_DB}}?sslmode=disable'

tasks:

  default:
    desc: "Показать список доступных задач"
    cmds:
      - task --list

  install:gcc:
    desc: "Установить gcc для CGO (только Windows)"
    platforms: [windows]
    status:
      - where gcc
    preconditions:
      - sh: where scoop
        msg: "Scoop не установлен. См. https://scoop.sh"
    cmds:
      - scoop install gcc

  format:
    desc: "Форматирует весь проект gofumpt + gci"
    cmds:
      - go tool gofumpt -extra -w .
      - go tool gci write -s standard -s default -s "prefix({{.MODULE_PATH}})" .

  lint:
    desc: "Запускает golangci-lint для всех модулей"
    cmds:
      - go tool golangci-lint run ./... --config=.golangci.yml

  test:
    desc: "Запустить тесты с детектором гонок"
    preconditions:
      - sh: where gcc
        msg: "gcc не найден. Установите: task install:gcc"
    cmds:
      - go test -race -count=1 ./...

  test:integration:
    desc: "Интеграционные тесты с Postgres"
    dotenv: [deployments/.env]
    env:
      DATABASE_URL: 'postgres://{{.POSTGRES_USER}}:{{.POSTGRES_PASSWORD}}@{{.POSTGRES_HOST}}:{{.POSTGRES_PORT}}/{{.POSTGRES_DB}}?sslmode=disable'
    cmds:
      - go test -tags=integration -race -count=1 ./...

  # --- MIGRATE ---

  migrate:up:
    desc: "Применить все миграции (SSP + DSP)"
    dotenv: [deployments/.env]
    cmds:
      - task: migrate:up:ssp
      - task: migrate:up:dsp

  migrate:up:ssp:
    desc: "Применить миграции SSP"
    dotenv: [deployments/.env]
    cmds:
      - goose -dir internal/db/migrations/ssp -table goose_ssp postgres "{{.DATABASE_URL}}" up

  migrate:up:dsp:
    desc: "Применить миграции DSP"
    dotenv: [deployments/.env]
    cmds:
      - goose -dir internal/db/migrations/dsp -table goose_dsp postgres "{{.DATABASE_URL}}" up

  migrate:down:ssp:
    desc: "Откатить последнюю миграцию SSP"
    dotenv: [deployments/.env]
    cmds:
      - goose -dir internal/db/migrations/ssp -table goose_ssp postgres "{{.DATABASE_URL}}" down

  migrate:down:dsp:
    desc: "Откатить последнюю миграцию DSP"
    dotenv: [deployments/.env]
    cmds:
      - goose -dir internal/db/migrations/dsp -table goose_dsp postgres "{{.DATABASE_URL}}" down

  migrate:status:
    desc: "Статус всех миграций"
    dotenv: [deployments/.env]
    cmds:
      - goose -dir internal/db/migrations/ssp -table goose_ssp postgres "{{.DATABASE_URL}}" status
      - goose -dir internal/db/migrations/dsp -table goose_dsp postgres "{{.DATABASE_URL}}" status

  # --- SEED ---

  seed:
    desc: "Залить seed-данные в PostgreSQL"
    dotenv: [deployments/.env]
    env:
      POSTGRES_HOST: '{{.POSTGRES_HOST}}'
      POSTGRES_PORT: '{{.POSTGRES_PORT}}'
      POSTGRES_USER: '{{.POSTGRES_USER}}'
      POSTGRES_PASSWORD: '{{.POSTGRES_PASSWORD}}'
      POSTGRES_DB: '{{.POSTGRES_DB}}'
    cmds:
      - go run ./cmd/seed

  # --- SSP ---

  run:ssp:
    desc: "Запустить SSP с in-memory хранилищем"
    dotenv: [deployments/.env]
    env:
      SSP_ADDR: '{{.SSP_ADDR | default ":50051"}}'
      DSP_API_KEY: '{{.DSP_API_KEY}}'
      DSP_NIKE_ADDR: '{{.DSP_NIKE_ADDR}}'
    cmds:
      - go run ./cmd/ssp

  run:ssp:postgres:
    desc: "Запустить SSP с PostgreSQL"
    dotenv: [deployments/.env]
    env:
      STORAGE: postgres
      SSP_ADDR: '{{.SSP_ADDR | default ":50051"}}'
      DSP_API_KEY: '{{.DSP_API_KEY}}'
      DSP_NIKE_ADDR: '{{.DSP_NIKE_ADDR}}'
      POSTGRES_HOST: '{{.POSTGRES_HOST}}'
      POSTGRES_PORT: '{{.POSTGRES_PORT}}'
      POSTGRES_USER: '{{.POSTGRES_USER}}'
      POSTGRES_PASSWORD: '{{.POSTGRES_PASSWORD}}'
      POSTGRES_DB: '{{.POSTGRES_DB}}'
    cmds:
      - go run ./cmd/ssp

  # --- DSP ---

  run:dsp:
    desc: "Запустить DSP с in-memory хранилищем"
    dotenv: [deployments/.env]
    env:
      DSP_ADDR: '{{.DSP_ADDR | default ":50052"}}'
      DSP_BID_MULTIPLIER_PERCENT: '{{.DSP_BID_MULTIPLIER_PERCENT | default "150"}}'
      DSP_API_KEYS: '{{.DSP_API_KEYS}}'
    cmds:
      - go run ./cmd/dsp

  # --- Publisher (позже) ---

  run:publisher:
    desc: "Запустить Publisher-эмулятор"
    dotenv: [deployments/.env]
    env:
      SSP_API_KEY: '{{.DSP_API_KEY}}'
    cmds:
      - go run ./cmd/publisher --rps {{.RPS | default "1"}} --duration {{.DURATION | default "10s"}} --verbose

  all:
    desc: "Полный цикл проверок: fmt - lint - test"
    cmds:
      - task: format
      - task: lint
      - task: test