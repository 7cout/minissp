version: '3'

dotenv:
  - deployments/.env

env:
  CGO_ENABLED: "1"

vars:
  MODULE_PATH: 'github.com/7cout/minissp'
  DATABASE_URL: 'postgres://{{.POSTGRES_USER}}:{{.POSTGRES_PASSWORD}}@{{.POSTGRES_HOST}}:{{.POSTGRES_PORT}}/{{.POSTGRES_DB}}?sslmode=disable'
  TEST_POSTGRES_DB: '{{.TEST_POSTGRES_DB | default "minissp_test"}}'
  TEST_DATABASE_URL: 'postgres://{{.POSTGRES_USER}}:{{.POSTGRES_PASSWORD}}@{{.POSTGRES_HOST}}:{{.POSTGRES_PORT}}/{{.TEST_POSTGRES_DB}}?sslmode=disable'

tasks:

  default:
    desc: "Показать список доступных задач"
    cmds:
      - task --list

  install:gcc:
    desc: "Установить gcc для CGO (только Windows)"
    platforms: [windows]
    status:
      - where gcc
    preconditions:
      - sh: where scoop
        msg: "Scoop не установлен. См. https://scoop.sh"
    cmds:
      - scoop install gcc

  format:
    desc: "Форматирует весь проект gofumpt + gci"
    cmds:
      - go tool gofumpt -extra -w .
      - go tool gci write -s standard -s default -s "prefix({{.MODULE_PATH}})" .

  lint:
    desc: "Запускает golangci-lint для всех модулей"
    cmds:
      - go tool golangci-lint run ./... --config=.golangci.yml

  test:
    desc: "Запустить тесты с детектором гонок"
    preconditions:
      - sh: where gcc
        msg: "gcc не найден. Установите: task install:gcc"
    cmds:
      - go test -race -count=1 ./...

  test:integration:
    desc: "Интеграционные тесты: Postgres + Redis (в отдельной БД)"
    dotenv: [deployments/.env]
    env:
      TEST_DATABASE_URL: '{{.TEST_DATABASE_URL}}'
      REDIS_ADDR: '{{.REDIS_ADDR | default "localhost:6379"}}'
    cmds:
      - task: db:recreate:test
      - task: migrate:up:test
      - go test -tags=integration -race -count=1 ./...

  # --- TEST DB ---

  db:recreate:test:
    desc: "Пересоздать тестовую БД (drop + create)"
    dotenv: [deployments/.env]
    cmds:
      - docker exec minissp-postgres psql -U {{.POSTGRES_USER}} -d postgres -c "DROP DATABASE IF EXISTS {{.TEST_POSTGRES_DB}} WITH (FORCE)"
      - docker exec minissp-postgres psql -U {{.POSTGRES_USER}} -d postgres -c "CREATE DATABASE {{.TEST_POSTGRES_DB}} OWNER {{.POSTGRES_USER}}"

  migrate:up:test:
    desc: "Применить миграции к тестовой БД (SSP + DSP)"
    dotenv: [deployments/.env]
    cmds:
      - goose -dir internal/db/migrations/ssp -table goose_ssp postgres "{{.TEST_DATABASE_URL}}" up
      - goose -dir internal/db/migrations/dsp -table goose_dsp postgres "{{.TEST_DATABASE_URL}}" up

  # --- MIGRATE ---

  migrate:up:
    desc: "Применить все миграции (SSP + DSP)"
    dotenv: [deployments/.env]
    cmds:
      - task: migrate:up:ssp
      - task: migrate:up:dsp

  migrate:up:ssp:
    desc: "Применить миграции SSP"
    dotenv: [deployments/.env]
    cmds:
      - goose -dir internal/db/migrations/ssp -table goose_ssp postgres "{{.DATABASE_URL}}" up

  migrate:up:dsp:
    desc: "Применить миграции DSP"
    dotenv: [deployments/.env]
    cmds:
      - goose -dir internal/db/migrations/dsp -table goose_dsp postgres "{{.DATABASE_URL}}" up

  migrate:down:ssp:
    desc: "Откатить последнюю миграцию SSP"
    dotenv: [deployments/.env]
    cmds:
      - goose -dir internal/db/migrations/ssp -table goose_ssp postgres "{{.DATABASE_URL}}" down

  migrate:down:dsp:
    desc: "Откатить последнюю миграцию DSP"
    dotenv: [deployments/.env]
    cmds:
      - goose -dir internal/db/migrations/dsp -table goose_dsp postgres "{{.DATABASE_URL}}" down

  migrate:status:
    desc: "Статус всех миграций"
    dotenv: [deployments/.env]
    cmds:
      - goose -dir internal/db/migrations/ssp -table goose_ssp postgres "{{.DATABASE_URL}}" status
      - goose -dir internal/db/migrations/dsp -table goose_dsp postgres "{{.DATABASE_URL}}" status

  # --- SEED ---

  seed:
    desc: "Залить seed-данные в PostgreSQL"
    dotenv: [deployments/.env]
    env:
      POSTGRES_HOST: '{{.POSTGRES_HOST}}'
      POSTGRES_PORT: '{{.POSTGRES_PORT}}'
      POSTGRES_USER: '{{.POSTGRES_USER}}'
      POSTGRES_PASSWORD: '{{.POSTGRES_PASSWORD}}'
      POSTGRES_DB: '{{.POSTGRES_DB}}'
    cmds:
      - go run ./cmd/seed

# --- Kafka ---      

  kafka:init:
    desc: "Создать топик impression в Kafka (идемпотентно)"
    cmds:
      - >
        docker exec -i minissp-kafka /opt/kafka/bin/kafka-topics.sh
        --bootstrap-server localhost:9092
        --create --if-not-exists
        --topic impression
        --partitions 3
        --replication-factor 1

  # --- SSP ---

  run:ssp:
    desc: "Запустить SSP с in-memory хранилищем"
    dotenv: [deployments/.env]
    env:
      SSP_ADDR: '{{.SSP_ADDR | default ":50051"}}'
      DSP_API_KEY: '{{.DSP_API_KEY}}'
      DSP_NIKE_ADDR: '{{.DSP_NIKE_ADDR}}'
      METRICS_ADDR: '{{.METRICS_ADDR | default ":9100"}}'
    cmds:
      - go run ./cmd/ssp

  run:ssp:postgres:
    desc: "Запустить SSP с PostgreSQL"
    dotenv: [deployments/.env]
    env:
      STORAGE: postgres
      SSP_ADDR: '{{.SSP_ADDR | default ":50051"}}'
      DSP_API_KEY: '{{.DSP_API_KEY}}'
      DSP_NIKE_ADDR: '{{.DSP_NIKE_ADDR}}'
      POSTGRES_HOST: '{{.POSTGRES_HOST}}'
      POSTGRES_PORT: '{{.POSTGRES_PORT}}'
      POSTGRES_USER: '{{.POSTGRES_USER}}'
      POSTGRES_PASSWORD: '{{.POSTGRES_PASSWORD}}'
      POSTGRES_DB: '{{.POSTGRES_DB}}'
      METRICS_ADDR: '{{.METRICS_ADDR | default ":9100"}}'
    cmds:
      - go run ./cmd/ssp

  # --- DSP ---

  run:dsp:
    desc: "Запустить DSP с in-memory хранилищем"
    dotenv: [deployments/.env]
    env:
      DSP_ADDR: '{{.DSP_ADDR | default ":50052"}}'
      DSP_BID_MULTIPLIER_PERCENT: '{{.DSP_BID_MULTIPLIER_PERCENT | default "150"}}'
      DSP_API_KEYS: '{{.DSP_API_KEYS}}'
      METRICS_ADDR: '{{.METRICS_ADDR | default ":9101"}}'
    cmds:
      - go run ./cmd/dsp

  run:dsp:postgres:
    desc: "Запустить DSP с PostgreSQL"
    dotenv: [deployments/.env]
    env:
      STORAGE: postgres
      DSP_ADDR: '{{.DSP_ADDR | default ":50052"}}'
      DSP_BID_MULTIPLIER_PERCENT: '{{.DSP_BID_MULTIPLIER_PERCENT | default "150"}}'
      DSP_API_KEYS: '{{.DSP_API_KEYS}}'
      POSTGRES_HOST: '{{.POSTGRES_HOST}}'
      POSTGRES_PORT: '{{.POSTGRES_PORT}}'
      POSTGRES_USER: '{{.POSTGRES_USER}}'
      POSTGRES_PASSWORD: '{{.POSTGRES_PASSWORD}}'
      POSTGRES_DB: '{{.POSTGRES_DB}}'
      METRICS_ADDR: '{{.METRICS_ADDR | default ":9101"}}'
    cmds:
      - go run ./cmd/dsp

  # --- Publisher ---

  run:publisher:
    desc: "Запустить Publisher-эмулятор"
    dotenv: [deployments/.env]
    env:
      SSP_API_KEY: '{{.DSP_API_KEY}}'
    cmds:
      - go run ./cmd/publisher --rps {{.RPS | default "1"}} --duration {{.DURATION | default "10s"}} --verbose

  all:
    desc: "Полный цикл проверок: fmt - lint - test"
    cmds:
      - task: format
      - task: lint
      - task: test