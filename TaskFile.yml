version: '3'

dotenv:
  - deployments/.env

env:
  CGO_ENABLED: "1"

vars:
  MODULE_PATH: 'github.com/7cout/minissp'
  DATABASE_URL: 'postgres://{{.POSTGRES_USER}}:{{.POSTGRES_PASSWORD}}@{{.POSTGRES_HOST}}:{{.POSTGRES_PORT}}/{{.POSTGRES_DB}}?sslmode=disable'

tasks:

  default:
    desc: "Показать список доступных задач"
    cmds:
      - task --list

  install:gcc:
    desc: "Установить gcc для CGO (только Windows)"
    platforms: [windows]
    status:
      - where gcc
    preconditions:
      - sh: where scoop
        msg: "Scoop не установлен. См. https://scoop.sh"
    cmds:
      - scoop install gcc     

  format:
    desc: "Форматирует весь проект gofumpt + gci"
    cmds:
      - go tool gofumpt -extra -w .
      - go tool gci write -s standard -s default -s "prefix({{.MODULE_PATH}})" .

  lint:
    desc: "Запускает golangci-lint для всех модулей"
    cmds:
      - go tool golangci-lint run ./... --config=.golangci.yml

  test:
    desc: "Запустить тесты с детектором гонок"
    preconditions:
      - sh: where gcc
        msg: "gcc не найден. Установите: task install:gcc"
    cmds:
      - go test -race -count=1 ./...

  migrate:up:
    desc: "Применить все миграции"
    cmds:
      - goose -dir internal/db/migrations postgres "{{.DATABASE_URL}}" up

  migrate:down:
    desc: "Откатить последнюю миграцию"
    cmds:
      - goose -dir internal/db/migrations postgres "{{.DATABASE_URL}}" down

  migrate:status:
    desc: "Показать статус миграций"
    cmds:
      - goose -dir internal/db/migrations postgres "{{.DATABASE_URL}}" status  

    # --- SSP (пока работает через cmd/auction) ---

  run:ssp:
    desc: "Запустить SSP с in-memory хранилищем"
    env:
      STORAGE: memory
    cmds:
      - go run ./cmd/auction

  run:ssp:postgres:
    desc: "Запустить SSP с PostgreSQL"
    dotenv: [deployments/.env]
    env:
      STORAGE: postgres
    cmds:
      - go run ./cmd/auction

  # --- DSP (пока только in-memory, postgres позже) ---

  run:dsp:
    desc: "Запустить DSP с in-memory хранилищем"
    env:
      DSP_ADDR: ":50052"
      DSP_BID_MULTIPLIER_PERCENT: "150"
    cmds:
      - go run ./cmd/dsp

  # --- Publisher (позже) ---

  run:publisher:
    desc: "Запустить Publisher"
    env:
      SSP_ADDR: "localhost:50051"
    cmds:
      - go run ./cmd/publisher

  test:integration:
    desc: "Интеграционные тесты"
    cmds:
      - go test -race -count=1 -tags=integration ./internal/auction/repository/postgres/...

  all:
    desc: "Полный цикл проверок: fmt - lint - test"
    cmds:
      - task: format
      - task: lint
      - task: test