syntax = "proto3";

package auction.v1;

option go_package = "github.com/7cout/minissp/proto/gen/auction/v1;auctionv1";

// AuctionService — проведение рекламных аукционов в реальном времени.
service AuctionService {
  // RunAuction проводит аукцион для указанного показа.
  //
  // Возвращает победившую кампанию, креатив и цену (second-price).
  // Если ставок нет — возвращает NOT_FOUND.
  // Если слот не найден — возвращает NOT_FOUND.
  rpc RunAuction (BidRequest) returns (BidResponse);
}

// BidRequest — запрос на проведение аукциона.
message BidRequest {
  string id = 1;      // уникальный ID запроса
  Imp imp = 2;        // описание показа
  string user_id = 3; // ID пользователя (может быть пустым)
}

// Imp — описание одного показа в рамках запроса.
message Imp {
  string id = 1;         // ID показа внутри запроса
  string slot_id = 2;    // ссылка на слот
  Banner banner = 3;     // параметры баннера
  int64 bid_floor = 4;   // минимальная цена в микроединицах
}

// Banner — параметры баннерного креатива.
message Banner {
  int32 width = 1;
  int32 height = 2;
}

// BidResponse — результат аукциона.
message BidResponse {
  string auction_id = 1;  // ID аукциона (для резерва и impression)
  string imp_id = 2;      // ID показа
  string bid_id = 3;      // ID победившей ставки
  string campaign_id = 4; // победившая кампания
  string creative_id = 5; // победивший креатив
  int64 price = 6;        // цена в микроединицах (second-price)
}