syntax = "proto3";

package ssp.v1;

option go_package = "github.com/7cout/minissp/proto/gen/ssp/v1;sspv1";

// SspService — внешний API SSP для Publisher.
//
// Аутентификация: каждый Publisher передаёт свой api-key в gRPC metadata
// (заголовок "api-key"). Сервер определяет publisher_id по ключу.
// В теле запросов publisher_id НЕ передаётся — его нельзя подделать.
service SspService {
  // RegisterSlot регистрирует рекламный слот издателя.
  //
  // Идемпотентно: если слот с таким именем уже существует у этого
  // Publisher'а, возвращается существующий.
  rpc RegisterSlot (RegisterSlotRequest) returns (Slot);

  // GetSlotByName возвращает слот по имени.
  rpc GetSlotByName (GetSlotByNameRequest) returns (Slot);

  // RunAuction проводит аукцион для указанного слота.
  rpc RunAuction (BidRequest) returns (BidResponse);

  // Impression сообщает, что показ состоялся.
  // Запускает биллинг: списание у DSP, начисление издателю.
  // Идемпотентен по auction_id.
  rpc Impression (ImpressionRequest) returns (ImpressionResponse);

  // GetPublisherBalance возвращает баланс издателя.
  rpc GetPublisherBalance (GetPublisherBalanceRequest) returns (GetPublisherBalanceResponse);
}

// --- Типы контента ---

// CreativeType — тип рекламного материала.
enum CreativeType {
  CREATIVE_TYPE_UNSPECIFIED = 0;
  CREATIVE_TYPE_BANNER      = 1;
  CREATIVE_TYPE_VIDEO       = 2;
  CREATIVE_TYPE_NATIVE      = 3;
  CREATIVE_TYPE_AUDIO       = 4;
}

// Banner — параметры баннерного креатива.
message Banner {
  int32 width  = 1;
  int32 height = 2;
}

// Video — параметры видеокреатива.
message Video {
  int32 width    = 1;
  int32 height   = 2;
  int32 duration = 3;
  repeated string mimes = 4;
}

// Native — параметры нативного креатива (заглушка).
message Native {}

// Audio — параметры аудиокреатива (заглушка).
message Audio {}

// --- Slot ---

// Slot — рекламное место издателя.
message Slot {
  string id           = 1;
  string publisher_id = 2;
  string name         = 3;
  string geo          = 4;
  int64  min_price    = 5;

  // Тип и параметры.
  CreativeType type   = 6;
  Banner       banner = 7;
  Video        video  = 8;
  Native       native = 9;
  Audio        audio  = 10;
}

message RegisterSlotRequest {
  string name      = 1;
  string geo       = 2;
  int64  min_price = 3;

  CreativeType type   = 4;
  Banner       banner = 5;
  Video        video  = 6;
  Native       native = 7;
  Audio        audio  = 8;
}

message GetSlotByNameRequest {
  string name = 1;
}

// --- RunAuction ---

// BidRequest — запрос рекламы от Publisher.
//
// Publisher НЕ присылает параметры слота — SSP знает их из БД.
message BidRequest {
  string request_id = 1;
  string slot_id    = 2;
  string user_id    = 3;
}

// BidResponse — результат аукциона.
//
// Publisher получает только то, что нужно для показа баннера.
// Внутренние детали (кампания, цена) остаются в SSP.
message BidResponse {
  string auction_id   = 1;
  string creative_url = 2;
  string click_url    = 3;
}

// --- Impression ---

message ImpressionRequest {
  string auction_id = 1;
}

message ImpressionResponse {
  bool ok = 1;
}

// --- Balance ---

message GetPublisherBalanceRequest {
  // Пусто — publisher определяется по api-key.
}

message GetPublisherBalanceResponse {
  int64 balance = 1;
}