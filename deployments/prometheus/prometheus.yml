global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # SSP работает на хосте, Prometheus — в контейнере.
  # host.docker.internal — адрес хоста из docker-сети.
  - job_name: ssp
    static_configs:
      - targets: ["host.docker.internal:9100"]

  - job_name: dsp
    static_configs:
      - targets: ["host.docker.internal:9101"]