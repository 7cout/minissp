version: '3'

shell: bash

vars:

  GO_VERSION: '1.27.1'
  GCI_VERSION: 'v0.13.7'
  GOFUMPT_VERSION: 'v0.12.0'
  GOLANGCI_LINT_VERSION: 'v2.13.2'

  MODULE_PATH: 'github.com/7cout/minissp'

  BIN_DIR: '{{.ROOT_DIR}}/.bin'
  GCI: '{{.BIN_DIR}}/gci'
  GOFUMPT: '{{.BIN_DIR}}/gofumpt'
  GOLANGCI_LINT: '{{.BIN_DIR}}/golangci-lint'

tasks:

  default:
    desc: "Показать список доступных задач"
    cmds:
      - task --list

  check:go:
    desc: "Проверить версию Go"
    cmds:
      - |
        REQUIRED="{{.GO_VERSION}}"
        CURRENT=$(go version | awk '{print $3}' | sed 's/go//')
        if [ "$CURRENT" != "$REQUIRED" ]; then
          echo "Ошибка: нужна Go $REQUIRED, установлена $CURRENT"
          exit 1
        fi
        echo "Go $CURRENT — OK"
    silent: true    

  install:mkdir:
    desc: "Создать папку для локальных бинарников"
    cmds:
      - mkdir -p {{.BIN_DIR}}
    status:
      - test -d {{.BIN_DIR}}   

  install:gofumpt:
    desc: "Установить gofumpt (если ещё не установлен) в ./bin"
    deps: [install:mkdir]
    cmds:
      - |
        [ -f {{.GOFUMPT}} ] || {
          echo 'Устанавливаем gofumpt {{.GOFUMPT_VERSION}}...'
          GOBIN={{.BIN_DIR}} go install mvdan.cc/gofumpt@{{.GOFUMPT_VERSION}}
        }
    status:
      - test -x {{.GOFUMPT}}

  install:gci:
    desc: "Установить gci (если ещё не установлен) в ./bin"
    deps: [install:mkdir]
    cmds:
      - |
        [ -f {{.GCI}} ] || {
          echo 'Устанавливаем gci {{.GCI_VERSION}}...'
          GOBIN={{.BIN_DIR}} go install github.com/daixiang0/gci@{{.GCI_VERSION}}
        }
    status:
      - test -x {{.GCI}}

  format:
    desc: "Форматирует весь проект gofumpt + gci"
    deps: [install:gci, install:gofumpt]
    cmds:
      - '{{.GOFUMPT}} -extra -w .'
      - '{{.GCI}} write -s standard -s default -s "prefix({{.MODULE_PATH}})" .'

  install:golangci-lint:
    desc: "Установить golangci-lint (если ещё не установлен) в ./bin"
    deps: [install:mkdir]
    cmds:
      - |
        [ -f {{.GOLANGCI_LINT}} ] || {
          echo 'Устанавливаем golangci-lint {{.GOLANGCI_LINT_VERSION}}...'
          GOBIN={{.BIN_DIR}} go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@{{.GOLANGCI_LINT_VERSION}}
        }
    status:
      - test -x {{.GOLANGCI_LINT}} 

  install:
    desc: "Установить все необходимые инструменты разработки"
    deps: [install:gci, install:gofumpt, install:golangci-lint]

  lint:
    desc: "Запускает golangci-lint для всех модулей"
    deps: [install:golangci-lint]
    cmds:
      - '{{.GOLANGCI_LINT}} run ./... --config=.golangci.yml'

  all:
    desc: "Полный цикл проверок: fmt - lint"
    cmds:
      - task: check:go
      - task: format
      - task: lint